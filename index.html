<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escolha uma Carta</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Fundo estilizado com gradiente radial profundo e vinheta suave */
body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 45%, #131b2e 0%, #070a12 60%, #020307 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #ffffff;
  overflow: hidden;
  user-select: none;
  position: relative;
}

/* Brilho ambiente sutil atrás das cartas */
body::before {
  content: "";
  position: absolute;
  width: 650px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(59, 130, 246, 0.12) 0%, rgba(139, 92, 246, 0.08) 40%, transparent 70%);
  filter: blur(50px);
  pointer-events: none;
}

.instrucao {
  margin-bottom: 55px;
  font-size: 1.2rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  color: #cbd5e1;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  transition: color 0.3s;
}

/* Container do baralho ajustado para as 6 cartas */
.baralho {
  position: relative;
  width: 520px;
  height: 320px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Estilo base das cartas (inalterado) */
.carta {
  position: absolute;
  width: 190px;
  height: 270px;
  border-radius: 22px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
              box-shadow 0.45s ease,
              z-index 0s 0.1s;
  transform-origin: bottom center;
  text-decoration: none;
}

.carta span {
  color: #ffffff;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

/* --- AS 3 CARTAS ORIGINAIS (MANTIDAS) --- */

/* Carta 1: Vermelho / Laranja vibrante */
.carta-1 {
  background: linear-gradient(145deg, #ff5722, #e60026);
  transform: rotate(-25deg) translate(-125px, 20px);
  z-index: 1;
}

/* Carta 2: Ciano / Turquesa */
.carta-2 {
  background: linear-gradient(145deg, #00f5d4, #00b4d8);
  transform: rotate(-15deg) translate(-75px, 10px);
  z-index: 2;
}

/* Carta 3: Roxo / Azul degradê */
.carta-3 {
  background: linear-gradient(145deg, #7b2cbf, #2563eb);
  transform: rotate(-5deg) translate(-25px, 2px);
  z-index: 3;
}

/* --- AS 3 NOVAS CARTAS (MESMO PADRÃO E CORES DIFERENTES) --- */

/* Carta 4: Dourado / Âmbar vibrante */
.carta-4 {
  background: linear-gradient(145deg, #ffd000, #ff8800);
  transform: rotate(5deg) translate(25px, 2px);
  z-index: 4;
}

/* Carta 5: Verde Esmeralda / Menta Neon */
.carta-5 {
  background: linear-gradient(145deg, #05f886, #00a86b);
  transform: rotate(15deg) translate(75px, 10px);
  z-index: 5;
}

/* Carta 6: Magenta / Rosa Choque */
.carta-6 {
  background: linear-gradient(145deg, #ff1493, #8a2be2);
  transform: rotate(25deg) translate(125px, 20px);
  z-index: 6;
}

/* Abertura suave em leque das 6 cartas ao passar o mouse no container */
.baralho:hover .carta-1 { transform: rotate(-32deg) translate(-170px, 30px); }
.baralho:hover .carta-2 { transform: rotate(-20deg) translate(-105px, 15px); }
.baralho:hover .carta-3 { transform: rotate(-7deg) translate(-35px, 3px); }
.baralho:hover .carta-4 { transform: rotate(7deg) translate(35px, 3px); }
.baralho:hover .carta-5 { transform: rotate(20deg) translate(105px, 15px); }
.baralho:hover .carta-6 { transform: rotate(32deg) translate(170px, 30px); }

/* Efeito ao focar/passar o mouse em UMA carta específica */
.carta:hover {
  z-index: 20 !important;
  transform: translateY(-40px) scale(1.08) rotate(0deg) !important;
}

/* Brilhos (glow) de cada carta ao passar o mouse */
.carta-1:hover { box-shadow: 0 20px 45px #141ffba6; }
.carta-2:hover { box-shadow: 0 20px 45px #0093f5a6; }
.carta-3:hover { box-shadow: 0 20px 45px #9131e6b3; }
.carta-4:hover { box-shadow: 0 20px 45px #ffb300b3; }
.carta-5:hover { box-shadow: 0 20px 45px #05f886b3; }
.carta-6:hover { box-shadow: 0 20px 45px #ff1493b3; }

/* Animação de clique rápido */
.carta:active {
  transform: translateY(-25px) scale(1.02) !important;
}
</style>
</head>
<body>

<p class="instrucao">Escolha uma carta 🤔</p>

<div class="baralho">
  <!-- Carta 1 -->
  <a href="carta-1.html" class="carta carta-1">
    <span>carta 1</span>
  </a>

  <!-- Carta 2 -->
  <a href="carta-2.html" class="carta carta-2">
    <span>carta 2</span>
  </a>

  <!-- Carta 3 -->
  <a href="carta-3.html" class="carta carta-3">
    <span>carta 3</span>
  </a>

  <!-- Carta 4 -->
  <a href="carta-4.html" class="carta carta-4">
    <span>carta 4</span>
  </a>

  <!-- Carta 5 -->
  <a href="carta-5.html" class="carta carta-5">
    <span>carta 5</span>
  </a>

  <!-- Carta 6 -->
  <a href="carta-6.html" class="carta carta-6">
    <span>carta 6</span>
  </a>
</div>

</body>
</html>
