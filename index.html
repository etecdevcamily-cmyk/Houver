<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escolha uma Carta</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Fundo com atmosfera sensual: vinho escuro, bordô e preto veludo */
body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 45%, #2a0312 0%, #150209 50%, #050003 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #ffffff;
  overflow: hidden;
  user-select: none;
  position: relative;
}

/* Névoa de luz sedutora e pulsante atrás das cartas */
body::before {
  content: "";
  position: absolute;
  width: 700px;
  height: 460px;
  background: radial-gradient(ellipse at center, rgba(236, 17, 97, 0.22) 0%, rgba(147, 12, 70, 0.14) 40%, rgba(50, 2, 22, 0.05) 70%, transparent 80%);
  filter: blur(55px);
  pointer-events: none;
  animation: pulsarAura 4s ease-in-out infinite alternate;
}

/* Textura suave de vinheta lateral */
body::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 100%);
  pointer-events: none;
}

.instrucao {
  margin-bottom: 55px;
  font-size: 1.25rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 600;
  color: #ffccd8;
  text-shadow: 0 0 18px rgba(255, 30, 105, 0.6), 0 2px 10px rgba(0, 0, 0, 0.9);
  position: relative;
  z-index: 2;
  transition: color 0.3s;
}

/* Container do baralho */
.baralho {
  position: relative;
  width: 520px;
  height: 320px;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

/* Estilo base das cartas (inalterado) */
.carta {
  position: absolute;
  width: 190px;
  height: 270px;
  border-radius: 22px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
              box-shadow 0.45s ease,
              z-index 0s 0.1s;
  transform-origin: bottom center;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.carta span {
  color: #ffffff;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

/* --- AS 3 CARTAS ORIGINAIS (MANTIDAS) --- */

/* Carta 1: Vermelho / Laranja vibrante */
.carta-1 {
  background: linear-gradient(145deg, #ff5722, #e60026);
  transform: rotate(-25deg) translate(-125px, 20px);
  z-index: 1;
}

/* Carta 2: Ciano / Turquesa */
.carta-2 {
  background: linear-gradient(145deg, #008bf5, #00b4d8);
  transform: rotate(-15deg) translate(-75px, 10px);
  z-index: 2;
}

/* Carta 3: Roxo / Azul degradê */
.carta-3 {
  background: linear-gradient(145deg, hsl(0, 100%, 50%), #790d0d);
  transform: rotate(-5deg) translate(-25px, 2px);
  z-index: 3;
}

/* --- AS OUTRAS 3 CARTAS --- */

/* Carta 4: Dourado / Âmbar vibrante */
.carta-4 {
  background: linear-gradient(145deg, hsl(273, 100%, 50%), #49037e);
  transform: rotate(5deg) translate(25px, 2px);
  z-index: 4;
}

/* Carta 5: Verde Esmeralda / Menta Neon */
.carta-5 {
  background: linear-gradient(145deg, #f8056a, #61054b);
  transform: rotate(15deg) translate(75px, 10px);
  z-index: 5;
}

/* Carta 6: Magenta / Rosa Choque */
.carta-6 {
  background: linear-gradient(145deg, #ff1493, #8a2be2);
  transform: rotate(25deg) translate(125px, 20px);
  z-index: 6;
}

/* Abertura suave em leque das 6 cartas ao passar o mouse no container */
.baralho:hover .carta-1 { transform: rotate(-32deg) translate(-170px, 30px); }
.baralho:hover .carta-2 { transform: rotate(-20deg) translate(-105px, 15px); }
.baralho:hover .carta-3 { transform: rotate(-7deg) translate(-35px, 3px); }
.baralho:hover .carta-4 { transform: rotate(7deg) translate(35px, 3px); }
.baralho:hover .carta-5 { transform: rotate(20deg) translate(105px, 15px); }
.baralho:hover .carta-6 { transform: rotate(32deg) translate(170px, 30px); }

/* Efeito ao focar/passar o mouse em UMA carta específica */
.carta:hover {
  z-index: 20 !important;
  transform: translateY(-42px) scale(1.08) rotate(0deg) !important;
}

/* Brilhos (glow) de cada carta ao passar o mouse */
.carta-1:hover { box-shadow: 0 20px 50px rgba(230, 0, 38, 0.75); }
.carta-2:hover { box-shadow: 0 20px 50px rgba(0, 180, 216, 0.75); }
.carta-3:hover { box-shadow: 0 20px 50px rgba(123, 44, 191, 0.8); }
.carta-4:hover { box-shadow: 0 20px 50px rgba(255, 170, 0, 0.75); }
.carta-5:hover { box-shadow: 0 20px 50px rgba(5, 248, 134, 0.75); }
.carta-6:hover { box-shadow: 0 20px 50px rgba(255, 20, 147, 0.85); }

/* Animação de clique rápido */
.carta:active {
  transform: translateY(-25px) scale(1.02) !important;
}

/* Respiração da aura misteriosa de fundo */
@keyframes pulsarAura {
  0% {
    transform: scale(0.95);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.08);
    opacity: 1;
  }
}
</style>
</head>
<body>

<p class="instrucao">Escolha uma carta ✨</p>

<div class="baralho">
  <!-- Carta 1 -->
  <a href="carta-1.html" class="carta carta-1">
    <span>carta 1</span>
  </a>

  <!-- Carta 2 -->
  <a href="carta-2.html" class="carta carta-2">
    <span>carta 2</span>
  </a>

  <!-- Carta 3 -->
  <a href="carta-3.html" class="carta carta-3">
    <span>carta 3</span>
  </a>

  <!-- Carta 4 -->
  <a href="carta-4.html" class="carta carta-4">
    <span>carta 4</span>
  </a>

  <!-- Carta 5 -->
  <a href="carta-5.html" class="carta carta-5">
    <span>carta 5</span>
  </a>

  <!-- Carta 6 -->
  <a href="carta-6.html" class="carta carta-6">
    <span>carta 6</span>
  </a>
</div>

</body>
</html>
