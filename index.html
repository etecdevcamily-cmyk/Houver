<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escolha uma Carta</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Fundo com atmosfera sensual */
body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 45%, #2a0312 0%, #150209 50%, #050003 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #ffffff;
  overflow: hidden;
  user-select: none;
  position: relative;
}

/* Névoa de luz sedutora e pulsante atrás das cartas */
body::before {
  content: "";
  position: absolute;
  width: 700px;
  height: 460px;
  background: radial-gradient(ellipse at center, rgba(236, 17, 97, 0.22) 0%, rgba(147, 12, 70, 0.14) 40%, rgba(50, 2, 22, 0.05) 70%, transparent 80%);
  filter: blur(55px);
  pointer-events: none;
  animation: pulsarAura 5s ease-in-out infinite alternate;
}

/* Textura suave de vinheta lateral */
body::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.65) 100%);
  pointer-events: none;
}

.instrucao {
  margin-bottom: 55px;
  font-size: 1.25rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 600;
  color: #ffccd8;
  text-shadow: 0 0 18px rgba(255, 30, 105, 0.6), 0 2px 10px rgba(0, 0, 0, 0.9);
  position: relative;
  z-index: 2;
}

/* Container do baralho */
.baralho {
  position: relative;
  width: 520px;
  height: 320px;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

/* Estilo base das cartas com transição mais lenta e suave */
.carta {
  position: absolute;
  width: 190px;
  height: 270px;
  border-radius: 22px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 24px 20px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
  /* Velocidade reduzida e amortecida para não dar solavanco */
  transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1),
              box-shadow 0.7s ease;
  transform-origin: bottom center;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transform: rotate(var(--rot)) translate(var(--tx), var(--ty));
}

/* Emojis */
.carta span {
  font-size: 2.4rem;
  line-height: 1;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
  transition: transform 0.7s ease;
  pointer-events: none;
}

/* Posições fixas e calibradas em variáveis para não perder o mouse */
.carta-1 {
  --rot: -22deg; --tx: -130px; --ty: 18px;
  background: linear-gradient(145deg, #3489f8, #007efb);
  z-index: 1;
}

.carta-2 {
  --rot: -13deg; --tx: -78px; --ty: 9px;
  background: linear-gradient(145deg, #008bf5, #00b4d8);
  z-index: 2;
}

.carta-3 {
  --rot: -4deg; --tx: -26px; --ty: 2px;
  background: linear-gradient(145deg, hsl(0, 100%, 50%), #790d0d);
  z-index: 3;
}

.carta-4 {
  --rot: 4deg; --tx: 26px; --ty: 2px;
  background: linear-gradient(145deg, hsl(273, 100%, 50%), #49037e);
  z-index: 4;
}

.carta-5 {
  --rot: 13deg; --tx: 78px; --ty: 9px;
  background: linear-gradient(145deg, #f8056a, #61054b);
  z-index: 5;
}

.carta-6 {
  --rot: 22deg; --tx: 130px; --ty: 18px;
  background: linear-gradient(145deg, #4442e0, #1d00fc);
  z-index: 6;
}

/* Efeito ao passar o mouse: a carta levanta de forma suave sem fugir do ponteiro */
.carta:hover {
  z-index: 25 !important;
  transform: rotate(var(--rot)) translate(var(--tx), calc(var(--ty) - 26px)) scale(1.05) !important;
}

.carta:hover span {
  transform: scale(1.12);
}

/* Brilhos suaves ao focar */
.carta-1:hover { box-shadow: 0 16px 40px rgba(0, 126, 251, 0.7); }
.carta-2:hover { box-shadow: 0 16px 40px rgba(0, 180, 216, 0.7); }
.carta-3:hover { box-shadow: 0 16px 40px rgba(255, 0, 0, 0.7); }
.carta-4:hover { box-shadow: 0 16px 40px rgba(187, 0, 255, 0.7); }
.carta-5:hover { box-shadow: 0 16px 40px rgba(248, 5, 106, 0.75); }
.carta-6:hover { box-shadow: 0 16px 40px rgba(68, 66, 224, 0.75); }

/* Clique firme e direto */
.carta:active {
  transform: rotate(var(--rot)) translate(var(--tx), calc(var(--ty) - 12px)) scale(1.02) !important;
  transition: transform 0.15s ease;
}

/* Pulsação lenta da luz de fundo */
@keyframes pulsarAura {
  0% { transform: scale(0.96); opacity: 0.75; }
  100% { transform: scale(1.04); opacity: 0.95; }
}
</style>
</head>
<body>

<p class="instrucao">Escolha uma carta ✨</p>

<div class="baralho">
  <!-- Carta 1 -->
  <a href="carta-1.html" class="carta carta-1">
    <span>❤️‍🔥</span>
  </a>

  <!-- Carta 2 -->
  <a href="carta-2.html" class="carta carta-2">
    <span>🤤</span>
  </a>

  <!-- Carta 3 -->
  <a href="carta-3.html" class="carta carta-3">
    <span>👀</span>
  </a>

  <!-- Carta 4 -->
  <a href="carta-4.html" class="carta carta-4">
    <span>🫣</span>
  </a>

  <!-- Carta 5 -->
  <a href="carta-5.html" class="carta carta-5">
    <span>🔥</span>
  </a>

  <!-- Carta 6 -->
  <a href="carta-6.html" class="carta carta-6">
    <span>🫦</span>
  </a>
</div>

</body>
</html>
