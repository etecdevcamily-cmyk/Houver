<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>carta 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b0a2e 0%, #05020a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .cartao {
      max-width: 500px;
      width: 100%;
      background: rgba(123, 44, 191, 0.1);
      border: 1px solid rgba(123, 44, 191, 0.4);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 0 50px rgba(123, 44, 191, 0.3);
      animation: subir 0.6s ease-out;
    }

    .tag {
      display: inline-block;
      padding: 6px 16px;
      background: #7b2cbf;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(123, 44, 191, 0.5);
    }

    h1 {
      font-size: 2.1rem;
      margin-bottom: 16px;
      color: #f3e8ff;
    }

    p {
      color: #d8b4fe;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-voltar {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #7b2cbf, #2563eb);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-voltar:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    }

    @keyframes subir {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="cartao">
    <div class="tag">Ship</div>
    <h1>INTERESSANTE...</h1>
    <p>Tem direito a uma pergunta ou pedido...</p>
    <a href="index.html" class="btn-voltar">← Voltar às cartas</a>
  </div>
</body>
</html>
