<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carta 4</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(circle at center, #261b02 0%, #080501 100%);
  display: flex; justify-content: center; align-items: center;
  font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; padding: 20px;
}
.cartao {
  max-width: 500px; width: 100%;
  background: rgba(255, 208, 0, 0.08);
  border: 1px solid rgba(255, 179, 0, 0.35);
  backdrop-filter: blur(14px);
  border-radius: 24px; padding: 40px 32px; text-align: center;
  box-shadow: 0 0 50px rgba(255, 179, 0, 0.22);
  animation: subir 0.6s ease-out;
}
.tag {
  display: inline-block; padding: 6px 16px; background: #6a00ff; color: #1a1200;
  border-radius: 99px; font-size: 0.85rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
}
h1 { font-size: 2.1rem; margin-bottom: 16px; color: #fffbeb; }
p { color: #fde68a; font-size: 1.05rem; line-height: 1.6; margin-bottom: 25px; }

.acoes {
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}

.btn-whatsapp {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; max-width: 320px; padding: 14px 24px;
  background: #25d366; color: #ffffff; text-decoration: none;
  font-weight: 700; font-size: 1rem; border-radius: 12px;
  box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}
.btn-whatsapp:hover {
  background: #20ba5a; transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
}

.btn-voltar {
  display: inline-block; padding: 10px 24px;
  background: transparent; color: #9ca3af; text-decoration: none;
  font-weight: 600; font-size: 0.9rem; border-radius: 8px;
  transition: color 0.2s;
}
.btn-voltar:hover { color: #ffffff; }

@keyframes subir {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="cartao">
  <div class="tag">brilho</div>
  <h1>VALE OURO!</h1>
  <p>Você tirou a carta dourada. Considere isso um sinal de que os seus melhores planos vão dar certo!</p>
  
  <div class="acoes">
    <a href="https://wa.me/5511999999999?text=Tirei%20a%20Carta%204%20no%20jogo!" target="_blank" class="btn-whatsapp">
      <span>💬 Enviar no WhatsApp</span>
    </a>
    <a href="index.html" class="btn-voltar">← Voltar às cartas</a>
  </div>
</div>
</body>
</html>
